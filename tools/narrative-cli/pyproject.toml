[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "narrative-cli"
version = "0.1.0"
description = "Narrative studio creation recipe CLI — narrative init + plan"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "click==8.3.3",
  "pydantic==2.12.5",
  "pyyaml==6.0.3",
  "jsonschema==4.23.0",
]

[project.scripts]
narrative = "narrative_cli.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "pytest-anyio>=4.0.0,<5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["narrative_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
