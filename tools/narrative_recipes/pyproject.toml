[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "narrative-recipes"
version = "1.0.0"
description = "Narrative Recipes Python Core — recipe loading, template engine, and equivalence oracle"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Reactive Narrative Studio", email = "studio@narrative.dev"},
]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["narrative_recipes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
