[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "narrative-validate-profiles"
version = "0.1.0"
description = "Profile validation tool for the Reactive Narrative Studio capability catalog (M10.2)"
requires-python = ">=3.12"
dependencies = [
    "jsonschema==4.23.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]
