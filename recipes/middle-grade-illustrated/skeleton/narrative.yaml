# Narrative project manifest
# Generated by creation-recipe: middle-grade-illustrated
# NOTE: createdAt is set by the project renderer at render time.

id: "{{ projectId }}"
recipeId: middle-grade-illustrated

audience:
  profile: "{{ audience }}"

format:
  type: novel
  illustrated: true

publishing:
  target: print-pdf

initialGoals:
  - establish-story-bible
  - establish-main-cast
  - outline-story

project:
  profiles:
    - "{{ audience }}"
  packs:
    - story_core
    - characters
    - editorial
    - visual_core
  skills:
    - story-intake
    - character-design
    - story-architecture
  publishingTargets:
    - print-pdf

outputLanguage: "{{ outputLanguage }}"
genre: "{{ genre }}"
imagePolicy: "{{ imagePolicy }}"
