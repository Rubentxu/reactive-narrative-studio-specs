id: SCN-M14-01-001
uat: UAT-M14-01
requirements: [REQ-M14-01, REQ-M14-02, REQ-M14-03, REQ-M14-04, REQ-M14-05, REQ-M14-06]
claims:
  proves:
    - El mismo source secuencial (SequentialArtIR del capítulo muestra) se renderiza a través de dos perfiles de presentación distintos: comic (LTR, paleta M13) y manga (RTL, monocromo con screentone), conmutables en la vista /comic.
    - El render manga declara data-direction="rtl", espeja la rejilla (panel 0 a la derecha del panel 1) y rellena los slots de arte con el patrón screentone; la paleta manga contiene solo grises.
    - El lettering narrativo (diálogo/captions) es idéntico en ambos renders y descargable como CBZ por perfil con páginas marcadas (data-profile) más ComicInfo.xml.
  doesNotProve:
    - Generación de imágenes real (los slots siguen siendo placeholders).
    - Calidad tipográfica manga o tonos auténticos (patrón determinista según doc 11).
    - Lectura del CBZ en visores de terceros.
steps:
  - { id: ui.build, driver: process, action: run, params: { cmd: pnpm, args: [build], cwd: control-plane, timeoutMs: 300000 } }
  - { id: ui.start-preview, driver: browser, action: start-preview, params: { port: 4173 } }
  - { id: ui.comic, driver: browser, action: navigate, params: { path: /comic } }
  - id: ui.probe-comic
    driver: browser
    action: evaluate
    params:
      script: >-
        (() => {
          const svg = document.querySelector('[data-testid="comic-page-view"] svg');
          const slots = Array.from(svg?.querySelectorAll('.comic-art-slot') ?? []);
          const lettering = svg?.querySelector('.comic-lettering-layer');
          const letteringTexts = Array.from(lettering?.querySelectorAll('text') ?? []).map((t) => t.textContent ?? '').join(' ');
          const colors = Array.from(svg?.querySelectorAll('[fill], [stroke]') ?? [])
            .flatMap((el) => [el.getAttribute('fill'), el.getAttribute('stroke')])
            .filter((c) => c && c.startsWith('#'));
          const isGray = (c) => {
            const hex = c.slice(1);
            const full = hex.length === 3 ? hex.split('').map((x) => x + x).join('') : hex;
            return full.slice(0, 2) === full.slice(2, 4) && full.slice(2, 4) === full.slice(4, 6);
          };
          return {
            profile: svg?.getAttribute('data-profile') ?? '',
            direction: svg?.getAttribute('data-direction') ?? '',
            artSlots: slots.length,
            slot0LeftOfSlot1: slots.length >= 2 ? Number(slots[0].getAttribute('x')) < Number(slots[1].getAttribute('x')) : false,
            hasPattern: Boolean(svg?.querySelector('pattern')),
            allGray: colors.every(isGray),
            hasDialogue: letteringTexts.includes('Abuela… ¿estás ahí?'),
          };
        })()
  - { id: ui.select-manga, driver: browser, action: click, params: { selector: '[data-testid="profile-manga"]', waitForUrlContains: "/comic" } }
  - id: ui.probe-manga
    driver: browser
    action: evaluate
    params:
      script: >-
        (() => {
          const svg = document.querySelector('[data-testid="comic-page-view"] svg');
          const slots = Array.from(svg?.querySelectorAll('.comic-art-slot') ?? []);
          const lettering = svg?.querySelector('.comic-lettering-layer');
          const letteringTexts = Array.from(lettering?.querySelectorAll('text') ?? []).map((t) => t.textContent ?? '').join(' ');
          const colors = Array.from(svg?.querySelectorAll('[fill], [stroke]') ?? [])
            .flatMap((el) => [el.getAttribute('fill'), el.getAttribute('stroke')])
            .filter((c) => c && c.startsWith('#'));
          const isGray = (c) => {
            const hex = c.slice(1);
            const full = hex.length === 3 ? hex.split('').map((x) => x + x).join('') : hex;
            return full.slice(0, 2) === full.slice(2, 4) && full.slice(2, 4) === full.slice(4, 6);
          };
          return {
            profile: svg?.getAttribute('data-profile') ?? '',
            direction: svg?.getAttribute('data-direction') ?? '',
            artSlots: slots.length,
            slot0RightOfSlot1: slots.length >= 2 ? Number(slots[0].getAttribute('x')) > Number(slots[1].getAttribute('x')) : false,
            patternCount: svg?.querySelectorAll('pattern').length ?? 0,
            slotsUsePattern: slots.length > 0 && slots.every((s) => (s.getAttribute('fill') ?? '').startsWith('url(#screentone-')),
            allGray: colors.every(isGray),
            hasDialogue: letteringTexts.includes('Abuela… ¿estás ahí?'),
          };
        })()
  - id: ui.download-manga-cbz
    driver: browser
    action: submit
    params:
      buttonSelector: "button.comic-download-cbz"
      artifactName: comic.proof.manga.cbz
  - { id: ui.select-comic, driver: browser, action: click, params: { selector: '[data-testid="profile-comic"]', waitForUrlContains: "/comic" } }
  - id: ui.download-comic-cbz
    driver: browser
    action: submit
    params:
      buttonSelector: "button.comic-download-cbz"
      artifactName: comic.proof.comic.cbz
oracles:
  - id: manga.comic-baseline-ltr
    type: browser-evaluate
    config:
      artifact: browser.ui.probe-comic.eval.json
      expected:
        profile: comic
        direction: ltr
        artSlots: 4
        slot0LeftOfSlot1: true
        hasPattern: false
        allGray: false
        hasDialogue: true
  - id: manga.rtl-screentone-monochrome
    type: browser-evaluate
    config:
      artifact: browser.ui.probe-manga.eval.json
      expected:
        profile: manga
        direction: rtl
        artSlots: 4
        slot0RightOfSlot1: true
        patternCount: 1
        slotsUsePattern: true
        allGray: true
        hasDialogue: true
  - id: cbz.manga-proof
    type: zip-entries
    config:
      artifact: comic.proof.manga.cbz
      minEntries: 11
      namesInclude: ["ComicInfo.xml"]
      entryContains:
        - namePrefix: "page-"
          contains: ["data-profile=\"manga\"", "screentone-", "Eso es imposible."]
      forbiddenNames: []
  - id: cbz.comic-proof
    type: zip-entries
    config:
      artifact: comic.proof.comic.cbz
      minEntries: 11
      namesInclude: ["ComicInfo.xml"]
      entryContains:
        - namePrefix: "page-"
          contains: ["data-profile=\"comic\"", "Eso es imposible."]
      forbiddenNames: []
  - id: browser.health
    type: browser
    config:
      consoleArtifact: browser.ui.comic.console.json
